name: NVX hosted Windows runtime validation

on:
  workflow_call:
    inputs:
      performance-threshold:
        description: CI relative regression threshold in percent
        type: number
        default: 50
      performance-absolute-tolerance-ms:
        description: CI absolute latency tolerance in milliseconds
        type: number
        default: 10
  workflow_dispatch:
    inputs:
      performance-threshold:
        description: CI relative regression threshold in percent
        type: number
        default: 50
      performance-absolute-tolerance-ms:
        description: CI absolute latency tolerance in milliseconds
        type: number
        default: 10

permissions:
  contents: read

env:
  PERFORMANCE_REGRESSION_THRESHOLD: ${{ inputs.performance-threshold }}
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: ${{ inputs.performance-absolute-tolerance-ms }}

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: ./.github/actions/build-guest
      - uses: actions/upload-artifact@v7
        with:
          name: whp-x86-guest
          path: |
            build/vmlinux
            build/vmlinux.config
            build/vmlinux.provenance.json
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
            build/initramfs.provenance.json
          if-no-files-found: error
  whp:
    needs: guest
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      NVX_IMAGE_CACHE: ${{ github.workspace }}/build/hosted-image-cache
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-openvmm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check scripts/
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python -m pyright
      - run: npm --prefix sdk/typescript ci
      - run: npm --prefix sdk/typescript run build
      - run: npm --prefix sdk/typescript test
      - uses: actions/download-artifact@v6
        with:
          name: whp-x86-guest
          path: build
      - name: Set up a Linux OCI converter in disposable WSL2
        id: converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = python -c "import sys;sys.path.insert(0,'scripts');from nvx_tools.build_constants import AlpineBuildConstants as A;print(A.MINIROOTFS_URL)"
          $expected = python -c "import sys;sys.path.insert(0,'scripts');from nvx_tools.build_constants import AlpineBuildConstants as A;print(A.MINIROOTFS_SHA256)"
          $archive = Join-Path $env:RUNNER_TEMP alpine.tar.gz
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'WSL rootfs checksum mismatch' }
          wsl --import NVX-Converter (Join-Path $env:RUNNER_TEMP nvx-converter) $archive --version 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 import failed' }
          wsl -d NVX-Converter -u root --exec sh -c 'apk add --no-cache docker; (dockerd > /tmp/nvx-docker.log 2>&1 < /dev/null &) ; for attempt in $(seq 1 120); do docker info >/dev/null 2>&1 && exit 0; sleep 1; done; cat /tmp/nvx-docker.log; exit 1'
          if ($LASTEXITCODE -ne 0) { throw 'Linux OCI converter daemon failed' }
          $wrapper = Join-Path $env:RUNNER_TEMP nvx-docker
          New-Item -ItemType Directory $wrapper | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE .github/scripts/docker-wsl.py
          Set-Content (Join-Path $wrapper docker.cmd) "@python `"$script`" %*"
          $wrapper | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Identify the pinned core
        id: core
        shell: pwsh
        run: |
          "revision=$(git -C openvmm rev-parse HEAD)" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: |
            openvmm/target/release/openvmm.exe
            build/openvmm.provenance.json
          key: whp-core-${{ steps.core.outputs.revision }}-${{ hashFiles('scripts/nvx_tools/build.py', 'scripts/nvx_tools/build_constants.py') }}
      - run: python scripts/nvx.py build-openvmm --backend whp
        id: build-core
        if: steps.core-cache.outputs.cache-hit != 'true'
      - name: Native Windows listener restore regressions
        if: steps.core-cache.outputs.cache-hit != 'true'
        id: check-core
        working-directory: openvmm
        run: cargo test --release -p openvmm_entry -p openvmm_helpers listener
      - uses: actions/cache/save@v4
        if: steps.build-core.conclusion == 'success' && steps.check-core.conclusion == 'success' && steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: |
            openvmm/target/release/openvmm.exe
            build/openvmm.provenance.json
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - run: python scripts/release-proof.py --acceptance-policy ci --platform windows-whp --output-dir build/whp-proof
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-whp-proof
          path: |
            build/whp-proof
            build/hosted-image-cache/instances/*/openvmm.log
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-whp-build
          path: |
            build/openvmm.provenance.json
            openvmm/target/release/openvmm.exe
          if-no-files-found: warn
      - name: Stop the owned converter
        if: always() && steps.converter.outcome != 'skipped'
        shell: pwsh
        run: wsl --terminate NVX-Converter
