name: NVX hosted Linux validation

on:
  push:
    branches: [dev, completion/ten-items]
    paths:
      - '.github/workflows/nvx-hosted-validation.yml'
      - '.github/actions/checkout-openvmm/**'
      - 'openvmm'
      - 'docker/**'
      - 'scripts/**'
      - 'sdk/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kvm-admission:
    name: Nested KVM admission / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Diagnose the actual host and admit a KVM VM
        run: |
          uname -a
          lscpu
          sudo modprobe kvm || true
          test -c /dev/kvm || { echo '::error::No KVM device is exposed by this runner'; exit 1; }
          ls -l /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          python3 - <<'PY'
          import fcntl
          import os
          device = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          try:
              version = fcntl.ioctl(device, 0xae00, 0)
              if version != 12:
                  raise RuntimeError(f'unsupported KVM API version: {version}')
              vm = fcntl.ioctl(device, 0xae01, 0)
              os.close(vm)
              print('KVM API 12: actual VM creation succeeded')
          finally:
              os.close(device)
          PY
  linux:
    name: Actual KVM probe and tests / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux-kvm
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-openvmm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: ./scripts/check.sh
      - run: python3 -m pyright
      - run: npm --prefix sdk/typescript ci && npm --prefix sdk/typescript run build && npm --prefix sdk/typescript test
      - run: python3 scripts/nvx.py build-openvmm --backend kvm
      - name: Check architecture-specific core packages
        working-directory: openvmm
        run: |
          cargo clippy --all-targets -p virt_mshv -p net_backend_resources
          cargo doc --no-deps -p virt_mshv -p net_backend_resources
          cargo test -p virt_mshv -p net_backend_resources
      - run: python3 scripts/nvx.py build-guest
      - name: Require real nested virtualization
        run: |
          sudo modprobe kvm || true
          if test -c /dev/kvm; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm || {
            echo '::error::This hosted runner has no usable /dev/kvm. It cannot provide KVM runtime evidence.'
            exit 1
          }
      - run: python3 scripts/release-proof.py --platform "$PLATFORM" --output-dir build/hosted-proof
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-linux-${{ matrix.arch }}-proof
          path: |
            build/hosted-proof
            ~/.nvx/cache/instances/*/openvmm.log
          if-no-files-found: warn
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-linux-${{ matrix.arch }}-build
          path: |
            build/openvmm.provenance.json
            build/vmlinux.provenance.json
            build/initramfs.provenance.json
            build/vmlinux
            build/Image
            build/vmlinux.config
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
            openvmm/target/release/openvmm
          if-no-files-found: warn
