name: NVX native WHP warm restore diagnostic

on:
  push:
    branches: [completion/windows-listener-assertion]
    paths: ['.github/workflows/nvx-whp-warm-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  warm-restore:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NVX_IMAGE_CACHE: ${{ github.workspace }}/build/hosted-image-cache
      OPENVMM_LOG: debug
      OPENVMM_STARTUP_PROFILE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-openvmm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v6
        with:
          name: hosted-whp-build
          run-id: 37179030537
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v6
        with:
          name: whp-x86-guest
          run-id: 37177040092
          github-token: ${{ github.token }}
          path: build
      - name: Set up a Linux OCI converter in disposable WSL2
        id: converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = python -c "import sys;sys.path.insert(0,'scripts');from nvx_tools.build_constants import AlpineBuildConstants as A;print(A.MINIROOTFS_URL)"
          $expected = python -c "import sys;sys.path.insert(0,'scripts');from nvx_tools.build_constants import AlpineBuildConstants as A;print(A.MINIROOTFS_SHA256)"
          $archive = Join-Path $env:RUNNER_TEMP alpine.tar.gz
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'WSL rootfs checksum mismatch' }
          wsl --import NVX-Converter (Join-Path $env:RUNNER_TEMP nvx-converter) $archive --version 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 import failed' }
          wsl -d NVX-Converter -u root --exec sh -c 'apk add --no-cache docker; (dockerd > /tmp/nvx-docker.log 2>&1 < /dev/null &) ; for attempt in $(seq 1 120); do docker info >/dev/null 2>&1 && exit 0; sleep 1; done; cat /tmp/nvx-docker.log; exit 1'
          if ($LASTEXITCODE -ne 0) { throw 'Linux OCI converter daemon failed' }
          $wrapper = Join-Path $env:RUNNER_TEMP nvx-docker
          New-Item -ItemType Directory $wrapper | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE .github/scripts/docker-wsl.py
          Set-Content (Join-Path $wrapper docker.cmd) "@python `"$script`" %*"
          $wrapper | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build the corrected pinned core when the reused executable differs
        shell: pwsh
        run: |
          $pinned = git -C openvmm rev-parse HEAD
          $reused = (Get-Content build/openvmm.provenance.json | ConvertFrom-Json).source_revision
          if ($reused -ne $pinned) {
            python scripts/nvx.py build-openvmm --backend whp
            if ($LASTEXITCODE -ne 0) { throw 'Native corrected core build failed' }
          }
      - run: python scripts/nvx.py verify
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-whp-build
          path: |
            build/openvmm.provenance.json
            openvmm/target/release/openvmm.exe
          if-no-files-found: error
      - name: Exercise retained runtime warm restore with native debug logs
        run: python scripts/nvx.py test-microvm --backend whp --scenario warm-clone --output-dir build/warm-probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whp-warm-restore-diagnostic
          path: |
            build/warm-probe
            build/hosted-image-cache/instances/*/*.json
            build/hosted-image-cache/instances/*/openvmm.log
          if-no-files-found: warn
          include-hidden-files: true
      - name: Restore native regression build prerequisites
        if: always()
        working-directory: openvmm
        run: cargo xflowey restore-packages --no-compat-igvm
      - name: Native restore broker regressions
        if: always()
        working-directory: openvmm
        run: cargo test --release -p virtio_console broker_restore
      - name: Native slow-copy clock regression
        if: always()
        working-directory: openvmm
        run: cargo test --release -p openvmm_entry snapshot_restore_clock_includes_private_ram_materialization
      - name: Stop the owned converter
        if: always() && steps.converter.outcome != 'skipped'
        shell: pwsh
        run: wsl --terminate NVX-Converter
