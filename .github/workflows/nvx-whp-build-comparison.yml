name: NVX same-runner WHP build comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Record the native host and resolve checkout identity
        id: identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/whp-comparison-host | Out-Null
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | ConvertTo-Json | Set-Content build/whp-comparison-host/cpu.json
          powercfg /getactivescheme > build/whp-comparison-host/power.txt
          $domain, $username = [Security.Principal.WindowsIdentity]::GetCurrent().Name -split '\\', 2
          "domain=$domain" | Out-File $env:GITHUB_OUTPUT -Append
          "username=$username" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/checkout@v5
        with:
          ref: 19459df26f6d9184ee279bf84fedbb01e2044266
          path: build/whp-compare-checkouts/baseline
          persist-credentials: false
      - uses: actions/checkout@v5
        env:
          USERDOMAIN: ${{ steps.identity.outputs.domain }}
          USERNAME: ${{ steps.identity.outputs.username }}
        with:
          repository: maceip/openvmm
          ref: 75b6560159c4ba903025ffd99dc3c95909002f49
          path: build/whp-compare-checkouts/baseline/openvmm
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: fd639237c481b03c514233c23934c9885260dd26
          path: build/whp-compare-checkouts/candidate
          persist-credentials: false
      - uses: actions/checkout@v5
        env:
          USERDOMAIN: ${{ steps.identity.outputs.domain }}
          USERNAME: ${{ steps.identity.outputs.username }}
        with:
          repository: maceip/openvmm
          ref: 4b20f45f173bd4d971ec71a710fe9045c801da79
          path: build/whp-compare-checkouts/candidate/openvmm
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: hosted-whp-build
          run-id: 37186596678
          github-token: ${{ github.token }}
          path: build/whp-compare-baseline-build
      - uses: actions/download-artifact@v6
        with:
          name: hosted-whp-build
          run-id: 37189066404
          github-token: ${{ github.token }}
          path: build/whp-compare-candidate-build
      - uses: actions/download-artifact@v6
        with:
          name: whp-x86-guest
          run-id: 37189066404
          github-token: ${{ github.token }}
          path: build/whp-compare-guest
      - name: Start the owned Linux OCI converter
        id: converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = python -c "import sys;sys.path.insert(0,'scripts');from nvx_tools.build_constants import AlpineBuildConstants as A;print(A.MINIROOTFS_URL)"
          $expected = python -c "import sys;sys.path.insert(0,'scripts');from nvx_tools.build_constants import AlpineBuildConstants as A;print(A.MINIROOTFS_SHA256)"
          $archive = Join-Path $env:RUNNER_TEMP alpine.tar.gz
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'WSL rootfs checksum mismatch' }
          wsl --import NVX-Converter (Join-Path $env:RUNNER_TEMP nvx-converter) $archive --version 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 import failed' }
          wsl -d NVX-Converter -u root --exec sh -c 'apk add --no-cache docker; (dockerd > /tmp/nvx-docker.log 2>&1 < /dev/null &) ; for attempt in $(seq 1 120); do docker info >/dev/null 2>&1 && exit 0; sleep 1; done; cat /tmp/nvx-docker.log; exit 1'
          if ($LASTEXITCODE -ne 0) { throw 'Linux OCI converter daemon failed' }
          $wrapper = Join-Path $env:RUNNER_TEMP nvx-docker
          New-Item -ItemType Directory $wrapper | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE .github/scripts/docker-wsl.py
          Set-Content (Join-Path $wrapper docker.cmd) "@python `"$script`" %*"
          $wrapper | Out-File $env:GITHUB_PATH -Append
      - name: Compare both retained builds without changing source or history
        run: python .github/scripts/compare-whp-builds.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whp-same-runner-build-comparison
          path: |
            build/whp-build-comparison
            build/whp-comparison-host
            build/whp-compare-image-cache/instances/*/openvmm.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Stop the owned converter
        if: always() && steps.converter.outcome != 'skipped'
        shell: pwsh
        run: wsl --terminate NVX-Converter
