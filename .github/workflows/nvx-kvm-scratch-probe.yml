name: NVX native KVM scratch snapshot probe

on:
  push:
    branches: [completion/guest-stream-boundary]
    paths:
      - '.github/workflows/nvx-kvm-scratch-probe.yml'
      - 'scripts/nvx_tools/microvm_tests.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scratch-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout-openvmm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Reuse the completed pinned native core and guest artifacts
        uses: actions/download-artifact@v6
        with:
          name: hosted-linux-x86_64-build
          run-id: 37176187417
          github-token: ${{ github.token }}
          path: .
      - name: Permit the downloaded native executable
        run: chmod +x openvmm/target/release/openvmm
      - name: Admit an actual KVM VM
        run: |
          sudo modprobe kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: python3 scripts/nvx.py verify
      - name: Repeat scratch snapshots ten times with capture integrity and retained failures
        run: |
          for trial in $(seq 1 10); do
            python3 scripts/nvx.py test-microvm --backend kvm --scenario scratch-snapshot --output-dir "build/scratch-probe/repeat-$trial"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kvm-scratch-snapshot-probe
          path: build/scratch-probe
          if-no-files-found: warn
          include-hidden-files: true
