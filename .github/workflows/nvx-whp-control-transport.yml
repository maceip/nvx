name: NVX native Windows control transport diagnostic

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional retained source revision for the regression control
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run native deadline, partial-read and disconnect regressions
        run: python -m unittest discover -s scripts -p test_control_session.py
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: build/transport-source
          persist-credentials: false
      - name: Measure the control reader and blocking lower bound
        timeout-minutes: 2
        env:
          NVX_PROBE_SOURCE_ROOT: ${{ github.workspace }}/build/transport-source
        run: python .github/scripts/probe-whp-control-transport.py --require-prompt-read
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whp-control-transport
          path: build/whp-control-transport
          if-no-files-found: warn
