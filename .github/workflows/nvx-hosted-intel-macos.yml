name: NVX hosted Intel macOS runtime validation

on:
  push:
    branches: [dev, completion/ten-items]
    paths:
      - '.github/workflows/nvx-hosted-intel-macos.yml'
      - '.github/actions/checkout-openvmm/**'
      - '.github/actions/build-guest/**'
      - 'openvmm'
      - 'scripts/**'
      - 'docker/**'
      - 'guest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: ./.github/actions/build-guest
      - uses: actions/upload-artifact@v7
        with:
          name: intel-macos-guest
          path: |
            build/vmlinux
            build/vmlinux.config
            build/vmlinux.provenance.json
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
            build/initramfs.provenance.json
          if-no-files-found: error
  intel-hvf:
    needs: guest
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-openvmm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: ./scripts/check.sh
      - run: python3 -m pyright
      - run: npm --prefix sdk/typescript ci && npm --prefix sdk/typescript run build && npm --prefix sdk/typescript test
      - uses: actions/download-artifact@v6
        with:
          name: intel-macos-guest
          path: build
      - name: Start the owned Linux OCI converter
        run: |
          brew install colima docker protobuf qemu
          colima start nvx-converter --cpus 2 --memory 4 --disk 20 --arch x86_64 --vm-type qemu --runtime docker
          docker info
      - name: Identify the pinned core
        id: core
        run: echo "revision=$(git -C openvmm rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: |
            openvmm/target/release/openvmm
            build/openvmm.provenance.json
          key: intel-hvf-core-${{ steps.core.outputs.revision }}-${{ hashFiles('scripts/nvx_tools/build.py', 'scripts/nvx_tools/build_constants.py', '.github/workflows/nvx-hosted-intel-macos.yml') }}
      - run: python3 scripts/nvx.py build-openvmm --backend hvf
        id: build-core
        if: steps.core-cache.outputs.cache-hit != 'true'
      - name: Native Intel core checks
        id: check-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        working-directory: openvmm
        run: |
          cargo clippy --all-targets -p sparse_mmap -p virt_hvf -p virt -p trycopy -p openvmm_hypervisors -p openvmm_resources -p openvmm_entry -p openvmm_defs -p openvmm_helpers
          cargo doc --no-deps -p sparse_mmap -p virt_hvf -p virt -p trycopy -p openvmm_hypervisors -p openvmm_resources -p openvmm_entry -p openvmm_defs -p openvmm_helpers
          cargo test -p sparse_mmap -p virt_hvf -p virt -p trycopy -p openvmm_hypervisors -p openvmm_resources -p openvmm_entry -p openvmm_defs -p openvmm_helpers
      - uses: actions/cache/save@v4
        if: steps.build-core.conclusion == 'success' && steps.check-core.conclusion == 'success' && steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: |
            openvmm/target/release/openvmm
            build/openvmm.provenance.json
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - run: python3 scripts/release-proof.py --platform darwin-x86_64 --output-dir build/intel-hvf-proof
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-intel-hvf-proof
          path: |
            build/intel-hvf-proof
            ~/.nvx/cache/instances/*/openvmm.log
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-intel-hvf-build
          path: |
            build/openvmm.provenance.json
            openvmm/target/release/openvmm
          if-no-files-found: warn
      - name: Stop the owned Linux converter
        if: always()
        run: colima stop nvx-converter
