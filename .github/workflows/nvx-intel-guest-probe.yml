name: NVX native Intel HVF guest diagnostic

on:
  push:
    branches: [completion/guest-stream-boundary]
    paths: ['.github/workflows/nvx-intel-guest-probe.yml', '.github/diagnostics/intel_readiness_sampling.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-build-guest:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      NVX_IMAGE_CACHE: ${{ github.workspace }}/build/intel-image-cache
      OPENVMM_LOG: trace
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 65329b2db8bb1a1fa10013816834306500468c51
          persist-credentials: false
      - uses: ./.github/actions/checkout-openvmm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python3 -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v6
        with:
          name: hosted-intel-hvf-build
          run-id: 37197856945
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v6
        with:
          name: intel-macos-guest
          run-id: 37197856945
          github-token: ${{ github.token }}
          path: build
      - name: Install the passive native thread sampling hook
        run: |
          git fetch --no-tags --depth=1 --no-recurse-submodules https://github.com/maceip/nvx.git "${GITHUB_SHA}"
          mkdir -p build/intel-sampling-hook
          git show "${GITHUB_SHA}:.github/diagnostics/intel_readiness_sampling.py" > build/intel-sampling-hook/sitecustomize.py
      - name: Verify the exact completed source and executable
        run: |
          chmod +x openvmm/target/release/openvmm
          codesign --verify --strict openvmm/target/release/openvmm
          python3 scripts/nvx.py verify
          python3 - <<'PY'
          import hashlib,json,os,platform,subprocess,sys
          from pathlib import Path
          metadata=json.loads(Path('build/openvmm.provenance.json').read_text())
          core=subprocess.check_output(['git','-C','openvmm','rev-parse','HEAD'],text=True).strip()
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert revision=='65329b2db8bb1a1fa10013816834306500468c51'
          assert core=='d591aaee1c5c10a10d8df85a48e865ec13031dc2'
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          assert not subprocess.check_output(['git','-C','openvmm','status','--porcelain'],text=True).strip()
          assert metadata['source_revision']==core and metadata['source_clean'] is True
          assert metadata['executable_sha256']==hashlib.sha256(Path('openvmm/target/release/openvmm').read_bytes()).hexdigest()
          assert metadata['executable_sha256']=='8c43d06e38b11e94fc256b1a8a00674a7ead58cd1c53b147d073c5e69ed324ee'
          assert platform.system()=='Darwin' and platform.machine()=='x86_64'
          baseline={'nvx_revision':revision,'core_revision':core,'executable_sha256':metadata['executable_sha256'],
                    'python_version':sys.version,'host':platform.platform(),
                    'workflow_revision':os.environ['GITHUB_SHA'],
                    'sampling_hook_sha256':hashlib.sha256(Path('build/intel-sampling-hook/sitecustomize.py').read_bytes()).hexdigest(),
                    'changed_option':'passive three-second native thread sample after the last TRACE marker; guest arguments and sealed stdin unchanged; no timing is admitted to history'}
          Path('build/intel-guest-source-before.json').write_text(json.dumps(baseline,indent=2)+'\n')
          print('Exact previously built Intel executable verified',core)
          PY
      - name: Start the owned Linux OCI converter
        id: converter
        run: |
          brew install colima docker qemu
          colima start nvx-converter --cpus 2 --memory 4 --disk 20 --arch x86_64 --vm-type qemu --runtime docker
          docker info
      - name: Prepare the OCI image before the timed guest probe
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json,os,subprocess,sys,time
          from pathlib import Path
          cache=Path(os.environ['NVX_IMAGE_CACHE'])
          offsets={}
          with Path('build/intel-image-prepare.log').open('w') as output, Path('build/intel-image-progress.log').open('w') as progress:
              child=subprocess.Popen([sys.executable,'-u','scripts/nvx.py','image','pull','python:3.12-slim'],stdout=output,stderr=subprocess.STDOUT)
              def report():
                  for work in sorted(cache.glob('nvx-image-*')):
                      try:
                          files={p.name:p.stat().st_size for p in work.iterdir() if p.is_file()}
                      except FileNotFoundError:
                          continue
                      line=json.dumps({'elapsed_seconds':round(time.monotonic()-started),'directory':work.name,'files':files})
                      print(line,flush=True);progress.write(line+'\n')
                      log=work/'convert.log'
                      try:
                          with log.open('rb') as stream:
                              stream.seek(offsets.get(str(log),0))
                              detail=stream.read()[-4096:].decode(errors='replace')
                              offsets[str(log)]=stream.tell()
                          if detail:print(detail,flush=True);progress.write(detail+'\n')
                      except FileNotFoundError:
                          pass
                  progress.flush()
              started=time.monotonic()
              while child.poll() is None:
                  report();time.sleep(20)
              report()
              raise SystemExit(child.returncode)
          PY
      - name: Reproduce the first failed policy scenario
        timeout-minutes: 5
        run: |
          PYTHONPATH="$PWD/build/intel-sampling-hook${PYTHONPATH:+:$PYTHONPATH}" python3 scripts/nvx.py test-microvm --backend hvf --scenario seccomp-profile --output-dir build/intel-guest-diagnostic
      - name: Verify unchanged source and executable after the diagnostic
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          path=Path('build/intel-guest-source-before.json')
          if not path.exists():
              raise SystemExit('No verified baseline was established; no guest diagnostic result is inferred')
          before=json.loads(path.read_text())
          after={'nvx_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                 'core_revision':subprocess.check_output(['git','-C','openvmm','rev-parse','HEAD'],text=True).strip(),
                 'executable_sha256':hashlib.sha256(Path('openvmm/target/release/openvmm').read_bytes()).hexdigest(),
                 'nvx_status':subprocess.check_output(['git','status','--porcelain'],text=True).strip(),
                 'core_status':subprocess.check_output(['git','-C','openvmm','status','--porcelain'],text=True).strip()}
          assert all(after[key]==before[key] for key in ('nvx_revision','core_revision','executable_sha256'))
          assert not after['nvx_status'] and not after['core_status']
          Path('build/intel-guest-source-after.json').write_text(json.dumps(after,indent=2)+'\n')
          print('Diagnostic source and exact native executable unchanged')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intel-guest-diagnostic
          path: |
            build/intel-guest-source-before.json
            build/intel-guest-source-after.json
            build/intel-image-prepare.log
            build/intel-image-progress.log
            build/intel-sampling-hook/sitecustomize.py
            build/intel-sampling-hook/sampling.jsonl
            build/intel-image-cache/nvx-image-*/convert.log
            build/intel-image-cache/nvx-image-*/result.json
            build/intel-guest-diagnostic
            build/intel-image-cache/instances/*/*.json
            build/intel-image-cache/instances/*/openvmm.log
            build/intel-image-cache/instances/*/native-thread-sample.txt
            build/intel-image-cache/instances/*/native-thread-sample-tool.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Stop the owned converter
        if: always() && steps.converter.outcome != 'skipped'
        run: colima stop nvx-converter
