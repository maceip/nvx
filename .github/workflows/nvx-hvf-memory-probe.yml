name: NVX native Intel HVF memory probe

on:
  push:
    branches: [dev, completion/ten-items, completion/guest-stream-boundary]
    paths:
      - '.github/workflows/nvx-hvf-memory-probe.yml'
      - 'scripts/probes/hvf-memory.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-memory:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compile, sign and exercise actual Hypervisor.framework mappings
        run: |
          mkdir -p build
          clang -Wall -Wextra -Werror scripts/probes/hvf-memory.c -framework Hypervisor -o build/hvf-memory
          cat > build/hvf-memory.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>
          PLIST
          codesign --force --sign - --entitlements build/hvf-memory.entitlements build/hvf-memory
          codesign --verify --strict build/hvf-memory
          build/hvf-memory > build/hvf-memory.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intel-hvf-memory-probe
          path: build/hvf-memory.log
          if-no-files-found: error
